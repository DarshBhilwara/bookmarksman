services:
  bookmarksman:
    build: ./server
    container_name: bookmarksman
    ports:
      - "${BOOKMARKSMAN_BIND:-0.0.0.0}:${BOOKMARKSMAN_PORT:-8080}:8080"
    environment:
      BOOKMARKSMAN_DATA: /data/profiles
    volumes:
      - bookmarksman-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  bookmarksman-data:
