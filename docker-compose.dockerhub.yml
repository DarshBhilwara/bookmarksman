# Published backend image; extension sources stay in this repository.
# Use this file by itself, not together with docker-compose.yml.
services:
  bookmarksman:
    image: "${BOOKMARKSMAN_IMAGE:?Set BOOKMARKSMAN_IMAGE to your Docker Hub image and version}"
    container_name: bookmarksman
    ports:
      - "${BOOKMARKSMAN_BIND:-0.0.0.0}:${BOOKMARKSMAN_PORT:-1024}:8080"
    environment:
      BOOKMARKSMAN_DATA: /data/profiles
    volumes:
      - bookmarksman-data:/data
    restart: unless-stopped

volumes:
  bookmarksman-data:
